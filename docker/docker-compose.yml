services:
  mysql:
    image: mysql:8.4
    container_name: simple_bilibili_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simple_bilibili}
      MYSQL_USER: ${MYSQL_USER:-simple_bilibili}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_mysql_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - simple_bilibili_net

  redis:
    image: redis:7.4-alpine
    container_name: simple_bilibili_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - simple_bilibili_net

  rmqnamesrv:
    image: apache/rocketmq:5.3.4
    container_name: simple_bilibili_rmqnamesrv
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "${RMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - simple_bilibili_net

  rmqbroker:
    image: apache/rocketmq:5.3.4
    container_name: simple_bilibili_rmqbroker
    user: "0:0"
    restart: unless-stopped
    depends_on:
      rmqnamesrv:
        condition: service_healthy
    command:
      [
        "sh",
        "mqbroker",
        "-n",
        "rmqnamesrv:9876",
        "-c",
        "/home/rocketmq/rocketmq-5.3.4/conf/broker.conf",
      ]
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "${RMQ_BROKER_PORT:-10911}:10911"
      - "${RMQ_BROKER_VIP_PORT:-10909}:10909"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.4/conf/broker.conf:ro
      - rmqbroker_store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - simple_bilibili_net

  rmq-topic-init:
    image: apache/rocketmq:5.3.4
    container_name: simple_bilibili_rmq_topic_init
    restart: "no"
    depends_on:
      rmqbroker:
        condition: service_healthy
    command: ["sh", "/init-topics.sh"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m"
      NAMESRV_ADDR: rmqnamesrv:9876
      CLUSTER_NAME: DefaultCluster
    volumes:
      - ./rocketmq/init-topics.sh:/init-topics.sh:ro
    networks:
      - simple_bilibili_net

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
    container_name: simple_bilibili_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rmq-topic-init:
        condition: service_completed_successfully
    environment:
      BILIBILI_APP_MODE: ${APP_MODE:-release}
      BILIBILI_APP_HTTP_ADDR: 0.0.0.0:8080
      BILIBILI_MYSQL_ADDR: mysql:3306
      BILIBILI_MYSQL_USER: ${MYSQL_USER:-simple_bilibili}
      BILIBILI_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_mysql_password}
      BILIBILI_MYSQL_DATABASE: ${MYSQL_DATABASE:-simple_bilibili}
      BILIBILI_REDIS_ADDR: redis:6379
      BILIBILI_ROCKETMQ_NAME_SERVERS: rmqnamesrv:9876
      BILIBILI_JWT_SECRET: ${JWT_SECRET:-docker_dev_jwt_secret_please_replace_in_prod}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"code\":0'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - simple_bilibili_net

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: simple_bilibili_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '\"code\":0'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - simple_bilibili_net

volumes:
  mysql_data:
  redis_data:
  rmqbroker_store:

networks:
  simple_bilibili_net:
    driver: bridge
